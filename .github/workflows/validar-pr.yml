name: Validar cambios de Subvenly

on:
  pull_request:
    branches: [main]
  push:
    branches: [mejora/cuestionario-territorial-ayudas]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis de scripts Python
        run: python -m compileall -q scripts
      - name: Validar catálogos y JavaScript
        run: python scripts/validar_datos.py
      - name: Ejecutar pruebas de importadores sin red
        run: python scripts/test_actualizadores.py
