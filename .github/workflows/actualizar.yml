name: Actualizar y publicar

on:
  schedule:
    - cron: "17 3 * * *"      # cada noche, a las 03:17 UTC (05:17 en España en verano, 04:17 en invierno)
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: subvenly-publish
  cancel-in-progress: ${{ github.actor != 'github-actions[bot]' }}

jobs:
  actualizar:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar convocatorias nuevas
        id: buscar
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/actualizar.py

      - name: Buscar convocatorias de la Unión Europea
        id: buscar_ue
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/actualizar_ue.py

      - name: Buscar licitaciones abiertas
        id: buscar_lic
        continue-on-error: true
        timeout-minutes: 4
        run: timeout --kill-after=10s 180s python scripts/actualizar_licitaciones.py

      - name: Vigilar las fuentes oficiales registradas
        id: vigilar_fuentes
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/vigilar_fuentes.py

      - name: Validar catálogo, territorio y JavaScript
        run: python scripts/validar_datos.py

      - name: Vigilar las páginas oficiales de las fichas
        id: vigilar
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/vigilar_creditos.py

      - name: Marcar fuentes que no se pudieron actualizar
        if: always()
        env:
          BDNS_OUTCOME: ${{ steps.buscar.outcome }}
          UE_OUTCOME: ${{ steps.buscar_ue.outcome }}
          LIC_OUTCOME: ${{ steps.buscar_lic.outcome }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          hoy = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          errores = []
          for variable, nombre in (("BDNS_OUTCOME", "BDNS"), ("UE_OUTCOME", "Unión Europea"), ("LIC_OUTCOME", "licitaciones")):
              if os.environ.get(variable) != "success":
                  errores.append(nombre)
          if not errores:
              raise SystemExit(0)
          p = Path("data/novedades.json")
          if p.exists() and any(x in errores for x in ("BDNS", "Unión Europea")):
              data = json.loads(p.read_text(encoding="utf-8"))
              data["estadoActualizacion"] = "parcial"
              data["erroresActualizacion"] = errores
              data["errorActualizacionFecha"] = hoy
              p.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          p = Path("data/licitaciones.json")
          if p.exists() and "licitaciones" in errores:
              data = json.loads(p.read_text(encoding="utf-8"))
              data["estadoActualizacion"] = "parcial"
              data["fuentesConError"] = list(set(data.get("fuentesConError", []) + ["La ejecución automática no terminó correctamente"]))
              data["errorActualizacionFecha"] = hoy
              p.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          print("Estado de cobertura marcado como parcial para: " + ", ".join(errores))
          PY

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "Subvenly bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Actualización automática de novedades" && git push)

      - name: Preparar la web
        run: |
          mkdir _site
          cp -r index.html favicon.svg assets fonts data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Resumen de actualización y cobertura
        if: always()
        run: |
          {
            echo "## Actualización de Subvenly"
            echo ""
            echo "- Publicación web: **${{ steps.deploy.outcome }}**"
            echo "- BDNS: **${{ steps.buscar.outcome }}**"
            echo "- Unión Europea: **${{ steps.buscar_ue.outcome }}**"
            echo "- Licitaciones: **${{ steps.buscar_lic.outcome }}**"
            echo "- Vigilancia de fuentes: **${{ steps.vigilar_fuentes.outcome }}**"
            echo "- Vigilancia de fichas: **${{ steps.vigilar.outcome }}**"
            echo ""
            if [[ "${{ steps.buscar.outcome }}" != "success" || "${{ steps.buscar_ue.outcome }}" != "success" || "${{ steps.buscar_lic.outcome }}" != "success" ]]; then
              echo "> **Aviso:** una o más fuentes automáticas no se han actualizado. La web puede seguir publicada con los datos anteriores o con una actualización parcial. Consulta los diagnósticos de `data/_diagnostico*.json`."
              echo "::warning::Una o más fuentes de Subvenly no se han actualizado."
            else
              echo "Las búsquedas automáticas principales terminaron correctamente. Esto no significa que el catálogo sea exhaustivo ni que cada convocatoria esté verificada individualmente."
            fi
            if [[ "${{ steps.vigilar_fuentes.outcome }}" != "success" || "${{ steps.vigilar.outcome }}" != "success" ]]; then
              echo ""
              echo "> La vigilancia de una o más páginas oficiales encontró errores o no pudo verificarlas; consulta los diagnósticos antes de cambiar el estado de una ayuda."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
