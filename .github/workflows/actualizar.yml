name: Actualizar y publicar

on:
  schedule:
    - cron: "17 3 * * *"      # cada noche, a las 03:17 UTC (05:17 en España en verano, 04:17 en invierno)
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: subvenly-publish
  cancel-in-progress: ${{ github.actor != 'github-actions[bot]' }}

jobs:
  actualizar:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar convocatorias nuevas
        id: buscar
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/actualizar.py

      - name: Importar novedades locales del CIDO (RSS oficial)
        id: buscar_cido
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/actualizar_cido.py

      - name: Buscar convocatorias de la Unión Europea
        id: buscar_ue
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/actualizar_ue.py

      - name: Buscar licitaciones abiertas
        id: buscar_lic
        continue-on-error: true
        timeout-minutes: 6
        run: timeout --kill-after=10s 300s python -u scripts/actualizar_licitaciones.py

      - name: Vigilar las fuentes oficiales registradas
        id: vigilar_fuentes
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/vigilar_fuentes.py

      - name: Validar catálogo, territorio y JavaScript
        run: python scripts/validar_datos.py

      - name: Vigilar las páginas oficiales de las fichas
        id: vigilar
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/vigilar_creditos.py

      - name: Marcar fuentes que no se pudieron actualizar
        if: always()
        env:
          BDNS_OUTCOME: ${{ steps.buscar.outcome }}
          UE_OUTCOME: ${{ steps.buscar_ue.outcome }}
          CIDO_OUTCOME: ${{ steps.buscar_cido.outcome }}
          LIC_OUTCOME: ${{ steps.buscar_lic.outcome }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          hoy = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          errores = []
          for variable, nombre in (("BDNS_OUTCOME", "BDNS"), ("UE_OUTCOME", "Unión Europea"), ("CIDO_OUTCOME", "CIDO"), ("LIC_OUTCOME", "licitaciones")):
              if os.environ.get(variable) != "success":
                  errores.append(nombre)
          if not errores:
              raise SystemExit(0)
          p = Path("data/novedades.json")
          if p.exists() and any(x in errores for x in ("BDNS", "Unión Europea", "CIDO")):
              data = json.loads(p.read_text(encoding="utf-8"))
              data["estadoActualizacion"] = "parcial"
              data["erroresActualizacion"] = errores
              data["errorActualizacionFecha"] = hoy
              p.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          p = Path("data/licitaciones.json")
          if p.exists() and "licitaciones" in errores:
              data = json.loads(p.read_text(encoding="utf-8"))
              data["estadoActualizacion"] = "parcial"
              data["fuentesConError"] = list(set(data.get("fuentesConError", []) + ["La ejecución automática no terminó correctamente"]))
              data["errorActualizacionFecha"] = hoy
              p.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          print("Estado de cobertura marcado como parcial para: " + ", ".join(errores))
          PY

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "Subvenly bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Actualización automática de novedades" && git push)

      - name: Preparar la web
        run: |
          mkdir _site
          cp -r index.html favicon.svg assets fonts data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Resumen de actualización y cobertura
        if: always()
        run: |
          read_diag_state() {
            python -c 'import json,sys; from pathlib import Path; p=Path("data")/sys.argv[1]; print(json.loads(p.read_text(encoding="utf-8")).get("estado", "desconocida") if p.exists() else "desconocida")' "$1" 2>/dev/null || echo "desconocida"
          }
          BDNS_DIAG_STATE=$(read_diag_state "_diagnostico.json")
          CIDO_DIAG_STATE=$(read_diag_state "_diagnostico_cido.json")
          UE_DIAG_STATE=$(read_diag_state "_diagnostico_ue.json")
          LIC_DIAG_STATE=$(read_diag_state "_diagnostico_licitaciones.json")
          LIC_PARTIAL=$(python -c 'import json; from pathlib import Path; p=Path("data/_diagnostico_licitaciones.json"); d=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; print(", ".join(d.get("fuentes_parciales", [])))' 2>/dev/null || true)
          LIC_ERRORS=$(python -c 'import json; from pathlib import Path; p=Path("data/_diagnostico_licitaciones.json"); d=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; print(", ".join(e.get("fuente", "desconocida") for e in d.get("errores", [])))' 2>/dev/null || true)
          read_monitor_counts() {
            python -c 'import json,sys; from pathlib import Path; p=Path("data")/sys.argv[1]; d=json.loads(p.read_text(encoding="utf-8")); v=list(d.get(sys.argv[2], {}).values()); print("igual={} cambio={} no_verificable={} inicializado={}".format(*(sum(x.get("estado")==s for x in v) for s in ("igual","cambio","no_verificable","inicializado"))))' "$1" "$2" 2>/dev/null || echo "desconocida"
          }
          read_monitor_unverified() {
            python -c 'import json,sys; from pathlib import Path; p=Path("data")/sys.argv[1]; d=json.loads(p.read_text(encoding="utf-8")); print(sum(x.get("estado")=="no_verificable" for x in d.get(sys.argv[2], {}).values()))' "$1" "$2" 2>/dev/null || echo "desconocida"
          }
          MONITOR_SOURCES=$(read_monitor_counts "vigilancia_fuentes.json" "fuentes")
          MONITOR_FICHAS=$(read_monitor_counts "vigilancia.json" "fichas")
          MONITOR_SOURCES_UNVERIFIED=$(read_monitor_unverified "vigilancia_fuentes.json" "fuentes")
          MONITOR_FICHAS_UNVERIFIED=$(read_monitor_unverified "vigilancia.json" "fichas")
          {
            echo "## Actualización de Subvenly"
            echo ""
            echo "- Publicación web: **${{ steps.deploy.outcome }}**"
            echo "- BDNS: **${{ steps.buscar.outcome }} · diagnóstico ${BDNS_DIAG_STATE}**"
            echo "- Unión Europea: **${{ steps.buscar_ue.outcome }} · diagnóstico ${UE_DIAG_STATE}**"
            echo "- CIDO (convocatorias locales de Cataluña): **${{ steps.buscar_cido.outcome }} · diagnóstico ${CIDO_DIAG_STATE}**"
            echo "- Licitaciones: **${{ steps.buscar_lic.outcome }} · cobertura ${LIC_DIAG_STATE}**"
            echo "- Vigilancia de fuentes: **${{ steps.vigilar_fuentes.outcome }} · ${MONITOR_SOURCES}**"
            echo "- Vigilancia de fichas: **${{ steps.vigilar.outcome }} · ${MONITOR_FICHAS}**"
            echo ""
            if [[ "${{ steps.buscar.outcome }}" != "success" || "${{ steps.buscar_ue.outcome }}" != "success" || "${{ steps.buscar_cido.outcome }}" != "success" || "${{ steps.buscar_lic.outcome }}" != "success" || "${BDNS_DIAG_STATE}" != "correcta" || "${UE_DIAG_STATE}" != "correcta" || "${CIDO_DIAG_STATE}" != "correcta" ]]; then
              echo "> **Aviso:** una o más fuentes automáticas no se han actualizado correctamente o su diagnóstico es parcial/desconocido. La web puede seguir publicada con datos anteriores o parciales. Consulta los diagnósticos data/_diagnostico*.json."
              echo "::warning::Una o más fuentes de Subvenly no se han actualizado correctamente."
            elif [[ "${LIC_DIAG_STATE}" != "completa" ]]; then
              echo "> **Aviso de cobertura:** las licitaciones se han actualizado con los registros recibidos, pero su cobertura no es completa o no está confirmada."
              if [[ -n "${LIC_PARTIAL}" ]]; then echo "> Páginas pendientes: **${LIC_PARTIAL}**."; fi
              if [[ -n "${LIC_ERRORS}" ]]; then echo "> Fuentes con error: **${LIC_ERRORS}**."; fi
              echo "::warning::Cobertura de licitaciones parcial o no confirmada."
            else
              echo "Las búsquedas automáticas principales terminaron correctamente. Esto no significa que el catálogo sea exhaustivo ni que cada convocatoria esté verificada individualmente."
            fi
            if [[ "${{ steps.vigilar_fuentes.outcome }}" != "success" || "${{ steps.vigilar.outcome }}" != "success" || "${MONITOR_SOURCES_UNVERIFIED}" != "0" || "${MONITOR_FICHAS_UNVERIFIED}" != "0" ]]; then
              echo ""
              echo "> La vigilancia encontró páginas no verificables o tareas de monitorización fallidas. Los cambios detectados requieren contraste con la fuente oficial antes de modificar requisitos, importes o plazos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
