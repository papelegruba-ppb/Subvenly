name: Validar cambios de Subvenly

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/**"
      - "test/**"

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probar rutas y personalización del test
        run: node scripts/test_rutas.js
      - name: Probar importadores y deduplicación de fuentes
        run: python scripts/test_actualizadores.py
      - name: Validar catálogo, fuentes, territorio y JavaScript
        run: python scripts/validar_datos.py
